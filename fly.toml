# fly.toml app configuration file generated for maxkey-back on 2026-09-14T18:23:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'maxkey-back'
primary_region = 'ams'

[build]

[deploy]
  # ADR-13 / task 18a.2: runs `Maxkeys.Api --migrate` once per release, before
  # new instances receive traffic.
  release_command = 'dotnet Maxkeys.Api.dll --migrate'

[env]
  # TODO(tech-debt): R2 Public Development URL, not a Custom Domain (see deploy/fly.toml).
  Storage__R2PublicBaseUrl = 'https://pub-d26599ecfc0f4b1092350d82115c5398.r2.dev'

  # Vercel production origin (ADR-18: frontend is a separate origin, CORS is mandatory).
  # `flyctl deploy` replaces the app's [env] wholesale, so this must stay committed here.
  Cors__AllowedOrigins__0 = 'https://maxkey-front.vercel.app'
  Cors__AllowedOrigins__1 = 'https://www.chekeys.com'

  # Mercado Pago back_urls target (design section 10) — without this, CreatePreferenceAsync
  # sends no back_urls/auto_return at all and MP shows its own confirmation page instead of
  # redirecting to /checkout/result. Same wholesale-replace risk as Cors above.
  Frontend__BaseUrl = 'https://chekeys.com'

  # Mercado Pago webhook notification target — must be this app's public HTTPS URL.
  Payments__NotificationUrl = 'https://maxkeys.fly.dev/webhooks/mercadopago'

  # Supabase JWT validation (design section 10). Same wholesale-replace risk as
  # Cors above — must stay committed here, not set only via `fly secrets`.
  Auth__Mode = 'Jwks'
  Auth__Issuer = 'https://gyclqawjpphtogezvleg.supabase.co/auth/v1'
  Auth__Audience = 'authenticated'
  Auth__JwksUrl = 'https://gyclqawjpphtogezvleg.supabase.co/auth/v1/.well-known/jwks.json'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
